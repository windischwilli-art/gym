<style>
/* Layout: phone-width app column, sticky header, content cards by role, fixed bottom tab bar */
:root{
  --bg:#EDF0EA; --surface:#FFFFFF; --surface2:#E2E7DF; --fg:#16201A; --muted:#5B695F; --line:#D2D9CE;
  --accent:#2747E0; --accent-fg:#FFFFFF; --accent-soft:#DCE2FB;
  --prot:#B9461A; --carb:#C08A0C; --fat:#0E8574; --good:#1E7A3C; --warn:#B26B00; --bad:#B42318;
  --c-food:#F2542D; --c-run:#1F6FFF; --c-lift:#8338EC; --c-coach:#0E9F6E; --sec:var(--accent);
  --hero1:#2747E0; --hero2:#8338EC; --hero3:#E6407A;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1310; --surface:#171E19; --surface2:#212A24; --fg:#E7EDE8; --muted:#97A59B; --line:#2B362F;
  --accent:#7D93FF; --accent-fg:#0B1030; --accent-soft:#232C55;
  --prot:#F08A5D; --carb:#E9BA45; --fat:#3CC7B1; --good:#52C27A; --warn:#E5A63A; --bad:#F2786D; --c-food:#FF7A52; --c-run:#5B95FF; --c-lift:#A970FF; --c-coach:#34D399; --hero1:#3550E8; --hero2:#7B35E0; --hero3:#D63A72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1310; --surface:#171E19; --surface2:#212A24; --fg:#E7EDE8; --muted:#97A59B; --line:#2B362F;
  --accent:#7D93FF; --accent-fg:#0B1030; --accent-soft:#232C55;
  --prot:#F08A5D; --carb:#E9BA45; --fat:#3CC7B1; --good:#52C27A; --warn:#E5A63A; --bad:#F2786D; --c-food:#FF7A52; --c-run:#5B95FF; --c-lift:#A970FF; --c-coach:#34D399; --hero1:#3550E8; --hero2:#7B35E0; --hero3:#D63A72; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;height:100%}
body{margin:0;min-height:100%;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body[data-sec="heute"]{--sec:var(--hero1)} body[data-sec="essen"]{--sec:var(--c-food)} body[data-sec="laufen"]{--sec:var(--c-run)} body[data-sec="kraft"]{--sec:var(--c-lift)} body[data-sec="coach"]{--sec:var(--c-coach)} body[data-sec="kalender"]{--sec:var(--hero2)}
body::before{content:"";position:fixed;inset:0 0 auto 0;height:340px;pointer-events:none;z-index:0;
 background:radial-gradient(420px 260px at 0% 0%,color-mix(in srgb,var(--sec) 22%,transparent),transparent 70%),radial-gradient(360px 240px at 100% 10%,color-mix(in srgb,var(--hero2) 14%,transparent),transparent 70%);transition:background .4s}
.app{position:relative;z-index:1}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:440px;margin:0 auto;padding:0 16px 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin-inline:-16px;padding-inline:16px;padding-block:14px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
header.top .eyebrow{color:var(--sec)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:2px 0 0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;margin:0;letter-spacing:.02em;text-wrap:balance}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:11px 18px;font-weight:600;font-size:15px;transition:transform .12s ease,filter .12s ease,box-shadow .2s}
.btn:not(.ghost){background:linear-gradient(135deg,var(--sec),color-mix(in srgb,var(--sec) 55%,var(--hero2)));color:#fff;box-shadow:0 6px 16px -8px color-mix(in srgb,var(--sec) 80%,transparent)}
.btn:active,.card[data-go]:active,.card[data-a]:active,.choice:active{transform:scale(.97)}
.link{transition:opacity .15s}.link:active{opacity:.6}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{color:var(--sec);font-weight:600;font-size:14px}
.icon-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.icon-btn:hover{background:var(--surface2)}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid transparent;border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent);outline:none}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.03em;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{padding:7px 13px;border-radius:999px;background:var(--surface2);font-weight:600;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px}
.banner{background:var(--accent-soft);color:var(--fg);border-radius:var(--r);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:440px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:10.5px;min-width:0;font-weight:600;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--sec)}
nav.tabs .ti{display:grid;place-items:center;padding:3px 16px;border-radius:999px;transition:background .25s}
nav.tabs button[aria-current="page"] .ti{background:color-mix(in srgb,var(--sec) 16%,transparent)}
nav.tabs svg{width:24px;height:24px}

/* ring */
.ringwrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:360px){.ringwrap{grid-template-columns:1fr;justify-items:center}}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-family:var(--display);font-weight:700;font-size:40px;line-height:1}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-family:var(--display);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}

/* macros */
.macro{display:flex;flex-direction:column;gap:6px}
.macro .lab{display:flex;justify-content:space-between;font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px}

/* stopwatch */
.watch{font-family:var(--display);font-weight:700;font-size:72px;line-height:.95;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.watch.on{color:var(--sec)}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}

/* sets */
.ex{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.ex:first-of-type{border-top:0;padding-top:0}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;align-items:center}
.setrow input{padding:8px 10px;text-align:center}
.setno{font-family:var(--display);font-weight:600;color:var(--muted);text-align:center}
.check{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.check[aria-pressed="true"]{background:var(--good);color:#fff}
.sethead{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:8px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center}

/* plan */
.day{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted)}
.day.today .d{color:var(--accent)}
.tip{display:grid;grid-template-columns:4px 1fr;gap:12px}
.tip i{border-radius:4px;background:var(--accent)}
.tip.warn i{background:var(--warn)} .tip.good i{background:var(--good)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:440px;max-height:88vh;border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;overflow:auto}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.spin{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface2);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;inset:28% 9%;border:3px solid rgba(255,255,255,.92);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.38)}
.cam .scanline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:#FF5A4E;box-shadow:0 0 8px #FF5A4E}
@media (prefers-reduced-motion:no-preference){.cam .scanline{animation:sl 1.6s ease-in-out infinite alternate}@keyframes sl{from{top:32%}to{top:68%}}}
.gps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}
.hero{background:linear-gradient(140deg,var(--hero1) 0%,var(--hero2) 62%,var(--hero3) 120%);color:#fff;
 --fg:#fff;--muted:rgba(255,255,255,.78);--surface2:rgba(255,255,255,.2);--accent:#fff;--bad:#FFC2BC;
 --prot:#FFB08A;--carb:#FFE27A;--fat:#7DF2DE;box-shadow:0 18px 40px -22px var(--hero2)}
.hero .btn:not(.ghost){background:#fff;color:var(--hero1);box-shadow:none}
.hero .btn.ghost{background:rgba(255,255,255,.18);color:#fff}
.tile{padding:12px;text-align:left;gap:6px}
.tile.run{background:color-mix(in srgb,var(--c-run) 13%,var(--surface))}
.tile.lift{background:color-mix(in srgb,var(--c-lift) 13%,var(--surface))}
.tile.run .eyebrow{color:var(--c-run)} .tile.lift .eyebrow{color:var(--c-lift)}
.tile .bar>i{background:var(--c-run)}
.streak{display:inline-flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;font-weight:700;font-size:14px;
 background:linear-gradient(135deg,#FF8A3D,#F2542D);color:#fff;box-shadow:0 6px 14px -8px #F2542D;white-space:nowrap}
.streak svg{width:15px;height:15px}
.streak.off{background:var(--surface2);color:var(--muted);box-shadow:none}
.mono{font-family:ui-monospace,Menlo,monospace}
.kgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.khead span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.kday{aspect-ratio:1/1.05;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:14px;background:var(--surface2);min-width:0;transition:transform .1s}
.kday:active{transform:scale(.94)}
.kday.has{background:color-mix(in srgb,var(--sec) 14%,var(--surface))}
.kday.future{opacity:.55}
.kday.today{box-shadow:inset 0 0 0 2px var(--sec)}
.kday.sel{background:var(--sec);color:#fff}.kday.sel .kd{box-shadow:0 0 0 1.5px #fff}
.kdots{display:flex;gap:2px;height:6px}
.kd{display:inline-block;width:6px;height:6px;border-radius:50%;vertical-align:middle}
.kd.run{background:var(--c-run)}.kd.lift{background:var(--c-lift)}.kd.act{background:var(--c-coach)}.kd.food{background:var(--c-food);opacity:.6}
.owntile{border:2px dashed color-mix(in srgb,var(--c-lift) 45%,transparent);background:transparent!important}
.synccode{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--sec) 10%,var(--surface2));border:1.5px dashed color-mix(in srgb,var(--sec) 45%,transparent)}
.synccode .mono{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap;user-select:all;-webkit-user-select:all}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.btn.sv,.btn.sv:not(.ghost){background:#FC4C02;color:#fff;box-shadow:0 6px 16px -8px #FC4C02}
@media (prefers-reduced-motion:no-preference){
 .anim .stack>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
 .anim .stack>*:nth-child(2){animation-delay:.05s}.anim .stack>*:nth-child(3){animation-delay:.1s}.anim .stack>*:nth-child(4){animation-delay:.15s}.anim .stack>*:nth-child(n+5){animation-delay:.2s}
 @keyframes rise{from{opacity:0;transform:translateY(14px)}}
 .anim .bar>i{animation:grow .9s cubic-bezier(.2,.8,.2,1) .15s both;transform-origin:left}
 @keyframes grow{from{transform:scaleX(0)}}
 .anim .ring .arc{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) .1s both}
 @keyframes ringin{from{stroke-dashoffset:var(--c)}}
 .streak svg{animation:flick 1.6s ease-in-out infinite alternate;transform-origin:50% 90%}
 @keyframes flick{to{transform:scale(1.12) rotate(-4deg)}}
}
details summary{cursor:pointer;font-weight:600;color:var(--fg)}
/* onboarding */
.obwrap{display:flex;flex-direction:column;gap:18px;padding-block:28px 32px;min-height:calc(100vh - 20px)}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;padding:14px 16px;border-radius:12px;background:var(--surface);border:2px solid transparent}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.unit{position:relative}
.unit input{font-size:18px;padding:13px 14px;padding-right:56px;background:var(--surface)}
.unit span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;font-weight:500;letter-spacing:0}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:16px;font-weight:600;font-size:14px;z-index:30;width:max-content;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
.tile.rec{box-shadow:inset 0 0 0 2px var(--good,#22a06b)}
</style>

</head>

// ---------- Import aus Garmin / Strava (GPX, TCX) ----------
function hav(a,b){const R=6371000,r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r;const x=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function parseActivity(xml){
 const doc=new DOMParser().parseFromString(xml,"application/xml");
 if(doc.getElementsByTagName("parsererror").length)throw new Error("xml");
 const tag=(el,n)=>el.getElementsByTagNameNS("*",n);
 const laps=tag(doc,"Lap");
 if(laps.length){let m=0,s=0;
  for(const l of laps){m+=+((tag(l,"DistanceMeters")[0]||{}).textContent||0);s+=+((tag(l,"TotalTimeSeconds")[0]||{}).textContent||0)}
  const act=tag(doc,"Activity")[0];
  return{km:m/1000,sec:s,start:laps[0].getAttribute("StartTime")||((tag(doc,"Id")[0]||{}).textContent),sport:act?act.getAttribute("Sport")||"":"",fmt:"TCX"}}
 const pts=tag(doc,"trkpt");if(pts.length<2)throw new Error("empty");
 let m=0,prev=null;
 for(const p of pts){const c=[+p.getAttribute("lat"),+p.getAttribute("lon")];if(prev)m+=hav(prev,c);prev=c}
 const t0=(tag(pts[0],"time")[0]||{}).textContent,t1=(tag(pts[pts.length-1],"time")[0]||{}).textContent;
 return{km:m/1000,sec:t0&&t1?(new Date(t1)-new Date(t0))/1000:0,start:t0,sport:((tag(doc,"type")[0]||{}).textContent||""),fmt:"GPX"};
}
async function importFiles(files){
 let added=0,skipped=0,bad=0;
 for(const f of files){
  try{const a=parseActivity(await f.text());
   if(a.sport&&!/run|lauf|trail|treadmill|^9$/i.test(a.sport.trim())){skipped++;continue}
   if(!(a.km>0.2)||!(a.sec>0)){bad++;continue}
   const src="imp:"+(a.start||f.name);
   if(S.runs.some(r=>r.src===src)){skipped++;continue}
   S.runs.push({id:uid(),date:a.start?iso(new Date(a.start)):TODAY(),km:r1(a.km),sec:Math.round(a.sec),type:(a.km>=14||a.sec>=4500)?"Langer Lauf":"Locker",src,via:"Import "+a.fmt});added++;
  }catch(e){bad++}
 }
 if(added)save();render(true);
 const parts=[];if(added)parts.push(added+(added===1?" Lauf importiert":" Läufe importiert"));if(skipped)parts.push(skipped+" übersprungen");if(bad)parts.push(bad+" nicht lesbar");
 toast(parts.join(" · ")||"Keine Läufe gefunden");
}

async function svToken(params){
 const r=await fetch("https://www.strava.com/oauth/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:SV.cid,client_secret:SV.secret,...params})});
 const j=await r.json().catch(()=>({}));
 if(!r.ok||!j.access_token){const e=new Error("token");e.status=r.status;throw e}
 SV.access=j.access_token;SV.refresh=j.refresh_token||SV.refresh;SV.exp=j.expires_at;
 if(j.athlete)SV.name=[j.athlete.firstname,j.athlete.lastname].filter(Boolean).join(" ");
 svSave();
}
async function svAccess(){if(SV.access&&SV.exp&&SV.exp*1000>Date.now()+60000)return SV.access;await svToken({grant_type:"refresh_token",refresh_token:SV.refresh});return SV.access}
function svActType(t){const m=[[/E?Bike|Ride|Velomobile|Handcycle/,"rad"],[/MountainBike/,"mtb"],[/Swim/,"schwimmen"],[/Hike/,"wandern"],[/Walk/,"gehen"],[/WeightTraining/,"kraft"],[/HighIntensity|Crossfit|Workout/,"hiit"],[/Elliptical|StairStepper/,"crosstrainer"],[/Rowing|Kayak|Canoe/,"rudern"],[/Soccer/,"fussball"],[/Tennis|Padel|Squash|Badminton|Pickleball/,"tennis"],[/Ski|Snowboard/,"ski"],[/Climb/,"klettern"],[/Yoga|Pilates/,"yoga"],[/Dance/,"tanzen"]];

async function svSync(manual){
 if(!svConnected()||SVUI.busy||!S)return;
 SVUI.busy=true;SVUI.msg="";paintStrava();
 try{
  const tok=await svAccess(),after=SV.last?Math.floor(SV.last/1000)-3*86400:Math.floor(Date.now()/1000)-90*86400;
  const all=[];
  for(let page=1;page<=5;page++){
   const r=await fetch(`https://www.strava.com/api/v3/athlete/activities?after=${after}&per_page=100&page=${page}`,{headers:{Authorization:"Bearer "+tok}});
   if(r.status===401){SV.access=null;svSave();throw new Error("auth")}
   if(r.status===429)throw new Error("rate");
   if(!r.ok)throw new Error("http");
   const arr=await r.json();all.push(...arr);if(arr.length<100)break;
  }
  let added=0;
  for(const a of all){
   const t=String(a.sport_type||a.type||"");
   if(!/Run/i.test(t)){const key=svActType(t);if(!key)continue;const src="strava:"+a.id;S.acts=S.acts||[];if(S.acts.some(x=>x.src===src))continue;
    const min=Math.round((a.moving_time||a.elapsed_time||0)/60);if(min<5)continue;
    S.acts.push({id:uid(),date:String(a.start_date_local||a.start_date||"").slice(0,10)||TODAY(),type:key,min,int:svInt(a),kcal:a.kilojoules?Math.round(a.kilojoules):0,src,via:"Strava"});added++;continue}
   const src="strava:"+a.id;if(S.runs.some(x=>x.src===src))continue;
   const km=(a.distance||0)/1000,sec=a.moving_time||a.elapsed_time||0;if(!(km>0.2&&sec>0))continue;
   S.runs.push({id:uid(),date:String(a.start_date_local||a.start_date||"").slice(0,10)||TODAY(),km:r1(km),sec,type:svRunType(a),src,via:"Strava",title:a.name||""});added++;
  }
  SV.last=Date.now();svSave();if(added)save();
  SVUI.msg=added?(added===1?"1 neuer Lauf":added+" neue Läufe"):"alles aktuell";
  if(added)render(true);if(manual||added)toast(added?SVUI.msg.replace("Läufe","Aktivitäten").replace("Lauf","Aktivität")+" von Strava":"Strava: alles aktuell");
 }catch(e){
  const bad=e.status===400||e.status===401;
  SVUI.msg=e.message==="auth"||bad?"Strava-Anmeldung abgelaufen. Bitte neu verbinden.":e.message==="rate"?"Strava-Limit erreicht. Versuch es in 15 Minuten nochmal.":"Strava nicht erreichbar. Prüfe deine Internetverbindung.";
  if(e.message==="auth"||bad){SV.refresh=null;SV.access=null;svSave()}
  if(manual)toast(SVUI.msg);
 }
 SVUI.busy=false;paintStrava();
}

function targets(p=S.profile){
 const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==="m"?5:-161);
 const ALLTAG={1.2:1.2,1.375:1.35,1.55:1.5,1.725:1.65},af=ALLTAG[p.activity]||Math.min(p.activity,1.65);
 const tdee=bmr*af;
 const kcal=Math.round((tdee+(p.goal==="lose"?-500:p.goal==="gain"?300:0))/10)*10;
 const prot=Math.round(p.weight*(p.goal==="lose"?2:p.goal==="gain"?1.8:1.6));
 const fat=Math.round(kcal*0.27/9);
 const carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
 const tr=p.train||"both";let km=(tr==="both"||tr==="run")?{easy:12,mid:25,pro:40}[p.level||"easy"]:0;
 try{if(km&&window.runWeekKm&&S&&p===S.profile&&S.profile.runCfg){const k=window.runWeekKm();if(k)km=k}}catch(e){}
 return{bmr:r0(bmr),tdee:r0(tdee),kcal,prot,fat,carb,fib:30,sug:50,sat:Math.round(kcal*.1/9),salt:5,km};
}
const foodsOn=d=>S.foods.filter(f=>f.date===d);
const fz=(f,k)=>(f.sat!=null?de(r1(f.sat*k))+" · "+de(r1(Math.max(0,f.f-f.sat)*k)):"– · –")+" · "+(f.salt!=null?de(r1(f.salt*k)):"–")+" g";
function sum(list){return list.reduce((a,f)=>({kcal:a.kcal+f.kcal,p:a.p+f.p,c:a.c+f.c,f:a.f+f.f,fib:a.fib+f.fib,sug:a.sug+f.sug,sat:a.sat+(f.sat||0),satF:a.satF+(f.sat!=null?f.f:0),salt:a.salt+(f.salt||0),saltN:a.saltN+(f.salt!=null?1:0),n:a.n+1}),{kcal:0,p:0,c:0,f:0,fib:0,sug:0,sat:0,satF:0,salt:0,saltN:0,n:0})}
// Verbrauch nach MET (Compendium of Physical Activities). Gezählt wird nur der Mehrverbrauch über Ruhe (MET − 1),
// weil der Grundumsatz schon im Tagesziel steckt.
const INTS=[["leicht","Leicht"],["mittel","Mittel"],["hart","Hart"]];
const INTF={leicht:.8,mittel:1,hart:1.2};
const RUN_MET=[[6.4,6],[8,8.3],[9.7,9.8],[10.8,10.5],[11.3,11],[12.1,11.8],[12.9,12.3],[13.8,12.8],[14.5,13.8],[16.1,14.5],[17.7,16],[19.3,19]];
function runMET(kmh){if(!(kmh>0))return 9.8;if(kmh<=RUN_MET[0][0])return Math.max(3.5,kmh/RUN_MET[0][0]*RUN_MET[0][1]);
 for(let i=1;i<RUN_MET.length;i++){const[a,am]=RUN_MET[i-1],[b,bm]=RUN_MET[i];if(kmh<=b)return am+(bm-am)*(kmh-a)/(b-a)}return 19}
const kgNow=()=>(S&&S.profile&&S.profile.weight)||75;
function runKcal(r){const h=r.sec>0?r.sec/3600:r.km/9.5,kmh=r.sec>0?r.km/h:9.5;return Math.max(0,(runMET(kmh)-1)*kgNow()*h)}
function runIntensity(r){const kmh=r.sec>0?r.km/(r.sec/3600):0;return kmh>=12.5?"hart":kmh>=9?"mittel":"leicht"}
const WK_MET={leicht:3.5,mittel:5,hart:6};
function wkKcal(w){return Math.max(0,((WK_MET[w.int||"mittel"]||5)-1)*kgNow()*(w.min||30)/60)}

const ACT_TYPES=[["rad","Radfahren",7.5],["mtb","Mountainbike",8.5],["schwimmen","Schwimmen",7],["wandern","Wandern",6],["gehen","Spazieren / Gehen",3.5],
 ["hiit","HIIT / Zirkeltraining",8],["kraft","Krafttraining (ohne App)",5],["crosstrainer","Crosstrainer",6],["rudern","Rudern / Rudergerät",7],
 ["fussball","Fussball",7],["tennis","Tennis / Padel",7.3],["ski","Skifahren / Langlauf",7.5],["klettern","Klettern / Bouldern",7.5],
 ["yoga","Yoga",3],["pilates","Pilates",3.5],["boxen","Boxen / Kampfsport",7.8],["volley","Volleyball / Basketball",6],["tanzen","Tanzen",5],["arbeit","Körperliche Arbeit",4.5],["anderes","Andere Sportart",6]];
const actType=k=>ACT_TYPES.find(a=>a[0]===k)||ACT_TYPES[ACT_TYPES.length-1];
function actKcal(a){if(a.kcal>0)return a.kcal;const met=actType(a.type)[2]*(INTF[a.int||"mittel"]||1);return Math.max(0,(met-1)*kgNow()*(a.min||0)/60)}
function burnedOn(d){return S.runs.filter(r=>r.date===d).reduce((a,r)=>a+runKcal(r),0)+S.workouts.filter(w=>w.date===d).reduce((a,w)=>a+wkKcal(w),0)+(S.acts||[]).filter(x=>x.date===d).reduce((a,x)=>a+actKcal(x),0)}

function dayTargets(d){const t=targets(),b=burnedOn(d);return{...t,base:t.kcal,burn:b,kcal:Math.round((t.kcal+b)/10)*10,carb:Math.round(t.carb+b*.65/4),fat:Math.round(t.fat+b*.35/9)}}
function weekStart(off=0){const d=new Date();const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd-7*off);return iso(d)}

const fmtTime=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};

function macroBar(label,val,goal,color,unit="g"){
 const pct=Math.min(100,goal?val/goal*100:0);
 return`<div class="macro"><div class="lab"><span><span class="dot" style="background:${color}"></span>${label}</span><span class="num" style="font-size:16px"><b>${r0(val)}</b> <span class="muted">/ ${goal} ${unit}</span></span></div><div class="bar"><i style="width:${pct}%;background:${color}"></i></div></div>`;
}
function ring(val,goal){
 const R=64,C=2*Math.PI*R,pct=Math.min(1,goal?val/goal:0),over=val>goal;
 return`<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="13"/><circle cx="75" cy="75" r="${R}" fill="none" stroke="${over?"var(--bad)":"var(--accent)"}" stroke-width="13" stroke-linecap="round" class="arc" style="--c:${C}" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" ${pct>0?"":'visibility="hidden"'}/></svg>`;
}

function icsWeek(){
 const time=(document.getElementById("ics-time")||{}).value||"18:00",alarm=+((document.getElementById("ics-alarm")||{}).value||0);
 S.profile.icsTime=time;save();
 const [hh,mm]=time.split(":").map(Number),pd=planDays(),now=new Date(),pad=n=>String(n).padStart(2,"0");
 const fmt=d=>d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+"T"+pad(d.getHours())+pad(d.getMinutes())+"00";
 const escI=t=>String(t).replace(/[\\,;]/g,m=>"\\"+m).replace(/\n/g,"\\n");
 const ev=[];
 for(let i=0;i<7;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i,hh,mm),p=pd[(d.getDay()+6)%7];
  if(/Ruhetag|Erholung/.test(p.t))continue;
  const dur=(p.d.match(/(\d+)\s*Min/)||[])[1]?+(p.d.match(/(\d+)\s*Min/)[1])+10:p.t==="Kraft"?60:45,end=new Date(d.getTime()+dur*60000);

 const kr=[],la=[];out.forEach((x,i)=>{if(x.t==="Kraft")kr.push({...x,i});else if(x.t==="Lauf")la.push({...x,i})});
 const res=Array(7).fill(null);
 W.forEach((w,i)=>{if(!w)return;
  if(w.k==="sport")res[i]={t:sportName(w),d:"Dein Training"+(w.min?", "+w.min+" Min.":""),opt:false,fixed:1,sport:w.act||"anderes",min:w.min||0};
  else if(w.k==="frei")res[i]={t:"Ruhetag",d:"Keine Zeit, andere Termine",opt:false,fixed:1};
  else if(w.k==="kraft"){const x=kr.shift();res[i]={...(x||{t:"Kraft",d:"Ganzkörper, 45 Min."}),i:undefined,fixed:1,opt:false}}
  else if(w.k==="lauf"){const x=la.shift();res[i]={...(x||{t:"Lauf",d:"Locker 30 Min."}),i:undefined,fixed:1,opt:false}}});
 // Restliche Einheiten auf freie Tage verteilen, möglichst nah am ursprünglichen Tag
 const rest=[...kr,...la].sort((a,b)=>a.i-b.i);let dropped=0;

  for(let j=0;j<7;j++){if(res[j]||W[j])continue;let sc=Math.abs(j-x.i)*2;

function timeMask(v){const d=String(v||"").replace(/\D/g,"").replace(/^0+(?=\d{3})/,"").slice(0,6);if(d.length<=2)return d;if(d.length<=4)return d.slice(0,-2)+":"+d.slice(-2);return d.slice(0,-4)+":"+d.slice(-4,-2)+":"+d.slice(-2)}

 for(const f of [...(S?S.foods:[])].reverse()){if(!(f.g>0)||seen.has(f.name))continue;seen.add(f.name);const k=100/f.g;
  out.push({name:f.name,kcal:f.kcal*k,p:f.p*k,c:f.c*k,f:f.f*k,fib:(f.fib||0)*k,sug:(f.sug||0)*k,sat:f.sat!=null?f.sat*k:null,salt:f.salt!=null?f.salt*k:null,portion:f.g,unit:"",key:"r:"+f.name,recent:true});if(out.length>=8)break}

 const all=allFoods(),nq=normT(q).trim();
 if(!nq)return all.filter(f=>f.recent).concat(all.filter(f=>f.mine)).slice(0,14);
 const words=nq.split(/\s+/),seen=new Set(),hits=[];
 for(const f of all){if(f.recent||seen.has(f.name))continue;const n=normT(f.name),na=f.alias?normT(f.name+" "+f.alias):n;if(!words.every(w=>na.includes(w)))continue;seen.add(f.name);
  const score=(n.startsWith(nq)?0:n.split(" ").some(x=>x.startsWith(words[0]))?1:2)+(f.online?3:0);hits.push([score,f])}

function zxReader(){if(!window.ZXing)return null;const Z=window.ZXing,h=new Map();

 else{const res=searchFoods(s.q),qq=s.q.trim();
  body=`<div class="row between"><h2>Lebensmittel suchen</h2><button class="icon-btn" aria-label="Schliessen" data-a="sClose">${I.x}</button></div>

  ${qq.length>=3?(ONLINE.busy&&ONLINE.q===qq?`<div class="row" style="justify-content:center;gap:8px"><div class="spin" style="width:20px;height:20px"></div><span class="small muted">Suche online …</span></div>`:ONLINE.q===qq&&ONLINE.err?`<p class="small muted">${esc(ONLINE.err)}</p>`:ONLINE.q===qq?"":`<button class="btn ghost block" data-a="sOnline">Online suchen: „${esc(qq)}“</button>`):""}
  <button class="btn ghost block" data-a="sCustom">Eigenes Lebensmittel eingeben</button>`}

 const sg=document.getElementById("sg");if(sg)sg.oninput=()=>{const g=num(sg.value)||0;SHEET.g=g;const f=SHEET.pick,k=g/100;
  pk.textContent=r0(f.kcal*k)+" kcal";pp.textContent=r1(f.p*k)+" g";pc.textContent=r1(f.c*k)+" g";pf.textContent=r1(f.f*k)+" g";px.textContent=r1(f.fib*k)+" · "+r1(f.sug*k)+" g";const pz=document.getElementById("pz");if(pz)pz.textContent=fz(f,k)};
 const sm=document.getElementById("smeal");if(sm)sm.onchange=()=>{SHEET.meal=sm.value};

// ---------- Events ----------
document.addEventListener("click",ev=>{
 const g=ev.target.closest("[data-go]");if(g){go(g.dataset.go);return}
 const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,d=b.dataset;
 if(a==="sScrim"&&ev.target!==b)return;
 switch(a){
  case"clearEx":S.foods=S.foods.filter(x=>!x.ex);S.runs=S.runs.filter(x=>!x.ex);S.workouts=S.workouts.filter(x=>!x.ex);S.example=false;save();render();toast("Beispieldaten gelöscht");break;
  case"addFood":openFood(d.meal);break;
  case"delFood":S.foods=S.foods.filter(f=>f.id!==d.id);save();render(true);break;
  case"sClose":case"sScrim":closeSheet();break;

  case"ownName":OWN.name=d.v;OWN.date=document.getElementById("own-date").value||OWN.date;OWN.min=document.getElementById("own-min").value;drawOwn();break;
  case"ownBase":OWN.base=d.v;OWN.name=document.getElementById("own-name").value||OWN.name;OWN.date=document.getElementById("own-date").value||OWN.date;OWN.min=document.getElementById("own-min").value;drawOwn();break;

   const list=OWN.base&&TEMPLATES[OWN.base]?TEMPLATES[OWN.base].slice():[];
   CUR={name,start:Date.now(),date,min,own:true,ex:list.map(e=>{const l=lastFor(e);return{e,sets:[0,1,2].map(i=>({kg:l?(l[i]||l[0]).kg:"",reps:l?(l[i]||l[0]).reps:"",done:false}))}})};
   OWN=null;closeSheet();tab="kraft";render();window.scrollTo(0,0);
   if(!list.length)setTimeout(()=>{const b=document.querySelector('[data-a="exAdd"]');if(b)b.click()},80);break}
  case"saveMyTpl":{if(!CUR||!CUR.ex.length)break;S.profile.myTpl=S.profile.myTpl||{};S.profile.myTpl[CUR.name]=CUR.ex.map(e=>e.e);if(S.profile.tpl)delete S.profile.tpl[CUR.name];save();render(true);toast("Vorlage „"+CUR.name+"“ gespeichert");break}
  case"kalPrev":case"kalNext":{KAL.m+=a==="kalPrev"?-1:1;if(KAL.m<0){KAL.m=11;KAL.y--}if(KAL.m>11){KAL.m=0;KAL.y++}render(true);break}
  case"kalDay":KAL.sel=d.d;render(true);break;
  case"kalToday":{const t=new Date();KAL={y:t.getFullYear(),m:t.getMonth(),sel:TODAY()};render(true);break}
  case"runFor":{const dd=d.d;tab="laufen";render();window.scrollTo(0,0);setTimeout(()=>{const r=document.getElementById("rdate");if(r)r.value=dd;const k=document.getElementById("rkm");if(k){k.scrollIntoView({block:"center"});k.focus()}},60);break}
  case"icsWeek":icsWeek();break;
  case"actOpen":SHEET=null;ACT={type:d.type||"rad",min:d.min||"",int:"mittel",kcal:"",date:d.d||TODAY()};drawAct();break;
  case"wkOpen":wkOpen();break;
  case"actInt":ACT.int=d.v;drawAct();break;
  case"actSave":{const m=num(ACT.min);if(!(m>0)){toast("Bitte die Dauer in Minuten eingeben");break}
   S.acts=S.acts||[];const x={id:uid(),date:ACT.date||TODAY(),type:ACT.type,min:Math.round(m),int:ACT.int,kcal:num(ACT.kcal)>0?Math.round(num(ACT.kcal)):0};S.acts.push(x);
   save();closeSheet();render(true);toast(actType(x.type)[1]+": +"+de(r0(actKcal(x)))+" kcal");break}
  case"delAct":S.acts=(S.acts||[]).filter(x=>x.id!==d.id);save();render(true);break;
  case"wkInt":if(CUR){CUR.int=d.v;render(true)}break;
  case"exSwap":case"exAdd":case"tplEdit":if(!window.guideEx2){toast("Bitte App einmal schliessen und neu öffnen, damit das Update geladen wird")}break;
  case"sPick":{const f=allFoods().find(x=>x.key===d.k);if(!f)break;
   if(f.online&&f.ean){S.products=S.products||{};S.products[f.ean]={name:f.name,kcal:f.kcal,p:f.p,c:f.c,sug:f.sug,f:f.f,sat:f.sat,salt:f.salt,fib:f.fib,portion:f.portion,ean:f.ean,src:"off"};save()}
   SHEET.pick=f;SHEET.g=f.portion||100;drawSheet();break}

   S.products=S.products||{};S.products[key]=prod;save();

   S.foods.push({id:uid(),date:TODAY(),meal:SHEET.meal,name:f.name,g:SHEET.g,kcal:f.kcal*k,p:f.p*k,c:f.c*k,f:f.f*k,fib:f.fib*k,sug:f.sug*k,...(f.sat!=null?{sat:f.sat*k}:{}),...(f.salt!=null?{salt:f.salt*k}:{})});save();closeSheet();render(true);toast(f.name+" hinzugefügt");break}

  case"wStart":W.running=true;W.start=Date.now();W.iv=setInterval(tick,250);gpsStart();render(true);break;

  case"saveRun":{const km=num(rkm.value),s=parseTime(rtime.value);if(!(km>0)||!(s>0)){toast("Distanz und Dauer prüfen");break}

  case"backup":doBackup();break;
  case"syncCreate":S.syncCode=genSyncCode();CLOUD.msg="";save();clearTimeout(CLOUD.timer);cloudPush(true);toast("Sync-Code erstellt. Notier ihn dir gut!");break;
  case"syncCopy":{const c=S&&S.syncCode;if(!c)break;const ok=()=>toast("Code kopiert");try{navigator.clipboard.writeText(c).then(ok,()=>{const el=document.getElementById("synccode");if(el){const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r)}toast("Code markiert, tippe auf Kopieren")})}catch(e){}break}
  case"syncNow":clearTimeout(CLOUD.timer);CLOUD.msg="";cloudPush(true);break;
  case"syncLoad":{const c=normCode((document.getElementById("syncin")||{}).value);if(!c){CLOUD.msg="Bitte gib deinen Sync-Code ein.";paintCloud();if(!S)render(true);break}
   if(!S)cloudLoad(c);else if(S.syncCode&&c===S.syncCode){clearTimeout(CLOUD.timer);cloudInit();toast("Das ist schon dein Code. Ich prüfe auf Neues.")}else{CLOUD.confirm=c;CLOUD.msg="";paintCloud()}break}
  case"syncLoadYes":{const c=CLOUD.confirm;CLOUD.confirm=null;if(c)cloudLoad(c);break}
  case"syncLoadNo":CLOUD.confirm=null;paintCloud();break;
  case"restore":document.getElementById("restorefile").click();break;
  case"restoreNo":PENDINGRESTORE=null;paintCloud();break;
  case"restoreYes":if(PENDINGRESTORE)applyRestore(PENDINGRESTORE);break;
  case"resetYes":RESETARM=false;cloudWipe();try{localStorage.removeItem("formwerk-v2")}catch(e){}S=null;OB=null;CUR=null;tab="heute";render();window.scrollTo(0,0);break;
 }
});
document.addEventListener("input",ev=>{
 const o=ev.target.dataset.ob;if(o&&OB)OB.p[o]=ev.target.value;
 if(CUR&&ev.target.id==="cur-min")CUR.min=ev.target.value;
 if(CUR&&ev.target.id==="cur-date"&&ev.target.value){CUR.date=ev.target.value}
 const s=ev.target.dataset.set;if(s&&CUR){const[x,i,k]=s.split("-");CUR.ex[x].sets[i][k]=ev.target.value}
});
document.addEventListener("change",ev=>{
 if(ev.target.id==="barcodefile"||ev.target.id==="labelfile"){const f=ev.target.files[0],w=ev.target.id;ev.target.value="";
  if(f&&SHEET&&SHEET.scan)scanBarcodeFile(f);return}
 if(ev.target.id==="restorefile"){const f=ev.target.files[0];ev.target.value="";if(!f)return;
  if(!S)applyRestore(f);else{PENDINGRESTORE=f;paintCloud();const el=document.getElementById("cloud");if(el)el.scrollIntoView({block:"center"})}return}
 if(ev.target.id==="impfile"){const fs=[...ev.target.files];ev.target.value="";if(fs.length&&S)importFiles(fs);return}
 const p=ev.target.dataset.p;if(!p)return;const v=ev.target.value;
 if(p==="targetWeight"&&v.trim()==="")S.profile[p]="";
 else S.profile[p]=["age","height","weight","activity","targetWeight"].includes(p)?(num(v)||S.profile[p]):p==="name"?v.trim():v;save();render(true);
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SHEET)closeSheet();
 if(e.key==="Enter"&&!S&&e.target.dataset&&e.target.dataset.ob){e.preventDefault();obNext()}
 if(e.key==="Enter"&&e.target.id==="syncin"){e.preventDefault();document.querySelector('[data-a="syncLoad"]').click()}
 if(e.key==="Enter"&&e.target.id==="eanin"){e.preventDefault();document.querySelector('[data-a="scanManual"]').click()}});
function tick(){const w=document.getElementById("watch");if(w)w.textContent=fmtTime(wElapsed());paintLive()}
function startRest(){stopRest();REST.left=REST.total=window.restSec?window.restSec():90;REST.iv=setInterval(()=>{REST.left--;const r=document.getElementById("rest");if(r)r.textContent=fmtTime(Math.max(0,REST.left));const p=document.getElementById("restprog");if(p)p.style.width=Math.max(0,REST.left/REST.total*100)+"%";
 if(REST.left>0&&REST.left<=3&&window.stBeep)window.stBeep(520,.08);
 if(REST.left<=0){stopRest();if(window.stBeep)window.stBeep(990,.3,2);toast("Pause vorbei, nächster Satz");if(tab==="kraft")render(true)}},1000)}
function stopRest(){clearInterval(REST.iv);REST.left=0}

let LASTPULL=0;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&W.running)wakeOn();if(document.hidden&&CLOUD.timer){clearTimeout(CLOUD.timer);cloudPush()}if(!document.hidden&&S&&S.syncCode&&!CUR&&!W.running&&!SHEET&&Date.now()-LASTPULL>60000){LASTPULL=Date.now();cloudInit()}if(!document.hidden&&S&&svConnected()&&(!SV.last||Date.now()-SV.last>15*60000))svSync(false);if(document.hidden&&SHEET&&SHEET.scan&&SHEET.scan.stage==="live"){stopCam();SHEET.scan={stage:"start"};drawSheet()}});
if("serviceWorker"in navigator&&!IS_NATIVE)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
render();animate();
cloudInit();
svCallback().then(h=>{if(!h&&S&&svConnected()&&(!SV.last||Date.now()-SV.last>15*60000))svSync(false)});
</script>
